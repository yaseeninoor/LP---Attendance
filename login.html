<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43"><title>Sign in | Life Pharma FZE HRM</title>
<style>
:root{color-scheme:light;--navy:#102a43;--blue:#1769aa;--line:#dce6f0;--muted:#66788a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at top right,#d9ecff,transparent 40%),#f4f7fb;font:16px/1.5 Inter,system-ui,-apple-system,sans-serif;color:#172b4d}.card{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 65px #102a4318}.logo{display:grid;place-items:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--navy),#2486d1);color:white;font-weight:900;font-size:20px;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--blue);text-transform:uppercase}h1{font-size:28px;line-height:1.15;margin:8px 0}p{color:var(--muted);font-size:14px;margin:8px 0 22px}label{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;min-height:48px}input:focus{outline:3px solid #2486d126;border-color:#2486d1}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),#2486d1);color:#fff;font:700 16px inherit;min-height:48px}button:disabled{opacity:.6}.msg{display:none;padding:12px;border-radius:11px;margin-top:14px;font-size:13px;overflow-wrap:anywhere}.msg.show{display:block}.msg.error{background:#fff0ef;color:#a11e17}.msg.ok{background:#eaf8f0;color:#12633b}.foot{font-size:12px;text-align:center;margin:20px 0 0;color:#8290a0}@media(max-width:420px){.card{padding:24px 20px}}
</style>
</head>
<body><main class="card"><div class="logo">LP</div><div class="eyebrow">Life Pharma FZE · Facility Management</div><h1>Secure HRM sign in</h1><p>Use your company-approved account. Access depends on your assigned role.</p>
<form id="form"><label for="email">Company email</label><input id="email" type="email" autocomplete="username" required maxlength="254" placeholder="name@company.com"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Enter your password"><button id="submit" type="submit">Sign in securely</button></form><div id="msg" class="msg" role="status" aria-live="polite"></div><div class="foot">Authorized employees only · Life Pharma FZE</div></main>
<script>
const API_BASE="https://lp---attendance.androidlover002.workers.dev";
const form=document.getElementById("form"),button=document.getElementById("submit"),msg=document.getElementById("msg");
function show(text,kind){msg.textContent=text;msg.className="msg show "+kind}
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="Signing in…";msg.className="msg";try{const r=await fetch(API_BASE+"/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value})});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.message||"Sign in failed");sessionStorage.setItem("lp_hrm_token",data.token);sessionStorage.setItem("lp_hrm_user",JSON.stringify(data.user));show("Signed in successfully. Login API is connected; dashboard routing will be added next.","ok");}catch(err){show(err.message==="Failed to fetch"?"Cannot reach the HRM API yet. Deploy worker.js to your Cloudflare Worker and verify CORS/API settings.":err.message,"error")}finally{button.disabled=false;button.textContent="Sign in securely"}});
</script></body></html>
