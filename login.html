<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LP HRM | Sign In</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f7fc;font:16px system-ui;color:#172b4d}.card{width:min(100%,420px);padding:28px;background:white;border:1px solid #dce6f0;border-top:5px solid #2486d1;border-radius:20px;box-shadow:0 18px 55px #102a4318}h1{margin:0}.muted{color:#697586;line-height:1.6}label{display:block;margin:16px 0 7px;font-weight:700;font-size:13px}input{box-sizing:border-box;width:100%;padding:13px;border:1px solid #dce4ee;border-radius:10px;font:inherit}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:10px;background:#1769aa;color:white;font:inherit;font-weight:800}.msg{display:none;padding:12px;margin-top:14px;border-radius:10px;background:#edf7ff;overflow-wrap:anywhere}.msg.show{display:block}.err{background:#fff1f0;color:#9f1d16}</style></head><body><main class="card"><h1>LP HRM</h1><p class="muted">Life Pharma FZE · Secure Admin & Employee Login</p><div id="msg" class="msg" role="status"></div><form id="f"><label for="email">Company email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="btn">Sign in</button></form><p class="muted">Account access is managed by your HRM administrator.</p></main><script>const API='https://lp---attendance.androidlover002.workers.dev';const msg=document.getElementById('msg');document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn');b.disabled=true;b.textContent='Signing in…';try{const r=await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in failed');sessionStorage.setItem('lp_hrm_token',d.token);sessionStorage.setItem('lp_hrm_user',JSON.stringify(d.user));msg.textContent='Login successful. Role: '+d.user.role+'. HRM dashboard integration is the next step.';msg.className='msg show'}catch(x){msg.textContent=x.message||'Connection failed';msg.className='msg show err'}finally{b.disabled=false;b.textContent='Sign in'}});</script></body></html>
